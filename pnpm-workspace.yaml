packages:
  - 'packages/*'
  - 'crates/*'
allowBuilds:
  '@vscode/vsce-sign': false
  esbuild: false
  keytar: false
minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - '@mizdra/*'
  # The typescript nightly (and its native binary packages) pinned for the content-mapper e2e tests
  - typescript
  - '@typescript/typescript-*'
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@0.2.1
  vite-plus: 0.2.1
overrides:
  vite: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'
